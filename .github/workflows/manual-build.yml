name: Manual Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant(s) to build'
        type: choice
        options: [release, debug, both]
        default: both
      officialBuild:
        description: 'true -> versionName oss-<N> ; false -> git-ref versionName (e.g. zygisk-b98550c0)'
        type: boolean
        default: false

permissions:
  contents: write   # needed by gh release create in the publish step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/*.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Write local.properties + signing key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          ALIAS_KEY_PASSWORD: ${{ secrets.ALIAS_KEY_PASSWORD }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}
        run: |
          echo "officialBuild=${{ inputs.officialBuild }}" >> local.properties
          echo "crowdinProjectId=$CROWDIN_PROJECT_ID" >> local.properties
          echo "crowdinApiKey=$CROWDIN_API_KEY" >> local.properties
          if [ -n "$KEY_STORE" ]; then
            echo "storePassword=$KEY_STORE_PASSWORD" >> local.properties
            echo "keyAlias=$ALIAS" >> local.properties
            echo "keyPassword=$ALIAS_KEY_PASSWORD" >> local.properties
            echo "fileDir=$PWD/key.jks" >> local.properties
            echo "$KEY_STORE" | base64 --decode > key.jks
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "::notice::Release will be signed with the repository keystore"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::KEY_STORE secret not set; release will be debug-signed (not distributable)"
          fi

      - name: Set build tasks
        run: |
          case "${{ inputs.variant }}" in
            release) echo "APP_TASK=:app:assembleRelease"     >> "$GITHUB_ENV"
                     echo "ZYG_TASK=:zygote:assembleRelease"  >> "$GITHUB_ENV"
                     echo "ZIP_GLOB=zygote/build/outputs/magisk/release/*.zip" >> "$GITHUB_ENV" ;;
            debug)   echo "APP_TASK=:app:assembleDebug"       >> "$GITHUB_ENV"
                     echo "ZYG_TASK=:zygote:assembleDebug"    >> "$GITHUB_ENV"
                     echo "ZIP_GLOB=zygote/build/outputs/magisk/debug/*.zip"   >> "$GITHUB_ENV" ;;
            both)    echo "APP_TASK=:app:assemble"            >> "$GITHUB_ENV"
                     echo "ZYG_TASK=:zygote:assemble"         >> "$GITHUB_ENV"
                     echo "ZIP_GLOB=zygote/build/outputs/magisk/*/*.zip"      >> "$GITHUB_ENV" ;;
          esac

      - name: Gradle prebuild
        run: ./gradlew prebuild

      - name: Build app
        run: ./gradlew "$APP_TASK"

      - name: Build zygote
        run: ./gradlew "$ZYG_TASK"

      - name: Verify release is not debug-signed
        if: (inputs.variant == 'release' || inputs.variant == 'both') && env.SIGNED == 'true'
        run: |
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::notice::apksigner not found on runner; skipping cert check"; exit 0; fi
          for APK in app/build/outputs/apk/release/*.apk; do
            [ -e "$APK" ] || continue
            if "$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | grep -q "CN=Android Debug"; then
              echo "::error::$APK is debug-signed (fileDir/key not picked up)"; exit 1
            fi
            echo "::notice::$APK signed with a non-debug key"
          done

      - name: Upload flashable zip(s)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hma-oss-${{ inputs.variant }}-zip
          path: ${{ env.ZIP_GLOB }}

      - name: Publish latest GitHub Release
        if: (inputs.variant == 'release' || inputs.variant == 'both') && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Derive version from whichever flashable zip exists (release preferred, debug fallback).
          ZIP=$(ls zygote/build/outputs/magisk/release/HMA-OSS-*-release.zip 2>/dev/null | sort | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls zygote/build/outputs/magisk/debug/HMA-OSS-*-debug.zip 2>/dev/null | sort | head -1)
          fi
          if [ -z "$ZIP" ]; then echo "::error::no flashable zip found to attach"; exit 1; fi
          VER=$(basename "$ZIP"); VER=${VER#HMA-OSS-}; VER=${VER%-release.zip}; VER=${VER%-debug.zip}

          # Collect flashable zips that were built (release + debug for 'both'; only release for 'release'),
          # plus a stable-named copy of each so releases/latest/download/<stable-name> is a permanent URL.
          ASSETS=()
          for Z in zygote/build/outputs/magisk/release/HMA-OSS-*-release.zip \
                   zygote/build/outputs/magisk/debug/HMA-OSS-*-debug.zip; do
            [ -e "$Z" ] || continue
            ASSETS+=("$Z")
            case "$(basename "$Z")" in
              *-release.zip) cp "$Z" HMA-OSS-latest-release.zip; ASSETS+=("HMA-OSS-latest-release.zip") ;;
              *-debug.zip)   cp "$Z" HMA-OSS-latest-debug.zip;   ASSETS+=("HMA-OSS-latest-debug.zip")   ;;
            esac
          done

          # translators.json — generated at build time, not committed (mirrors main.yml:114).
          if [ -f app/src/main/assets/translators.json ]; then
            ASSETS+=("app/src/main/assets/translators.json")
          else
            echo "::warning::translators.json not found; skipping"
          fi

          # Source archives — clean git archive of the checked-out commit (no .git, no build outputs).
          SRC_PREFIX="HMA-OSS-$VER"
          git archive --format=zip --prefix="$SRC_PREFIX/" --output="HMA-OSS-source-$VER.zip" "$GITHUB_SHA"
          git archive --format=tar --prefix="$SRC_PREFIX/" "$GITHUB_SHA" | gzip -9 > "HMA-OSS-source-$VER.tar.gz"
          ASSETS+=("HMA-OSS-source-$VER.zip" "HMA-OSS-source-$VER.tar.gz")

          printf 'HMA-OSS %s (latest)\n\nBranch: %s\nCommit: %s\nversionName: %s\n\nAssets:\n- HMA-OSS-zygisk-<hash>-release.zip - flashable, release-signed (daily use)\n- HMA-OSS-zygisk-<hash>-debug.zip - flashable, debug-signed (testing)\n- HMA-OSS-latest-release.zip / -debug.zip - stable-named copies (permanent URLs below)\n- translators.json - translator credits\n- HMA-OSS-source-<hash>.zip / .tar.gz - clean source snapshot of this commit\n\nThe release flashable zip embeds manager.apk signed with the repository release key - apksigner cert SHA-256:\n48:07:52:69:09:D9:07:8B:4C:9E:5B:D3:53:B8:E5:48:2F:D2:CB:D0:12:2B:30:1C:0D:4D:BB:02:B0:9A:11:51\n\nVerify: unzip a flashable zip, `apksigner verify --print-certs manager.apk`.\n\nStable download URLs (always point to the newest build):\n- https://github.com/%s/releases/latest/download/HMA-OSS-latest-release.zip\n- https://github.com/%s/releases/latest/download/HMA-OSS-latest-debug.zip\n- https://github.com/%s/releases/latest/download/translators.json\n' \
            "$VER" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$VER" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" > RELEASE_NOTES.txt

          # Rolling public `latest` - delete + recreate each run so it always holds the newest build.
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HMA-OSS $VER (latest)" \
            --notes-file RELEASE_NOTES.txt \
            --latest \
            "${ASSETS[@]}"